# --- 物理形状（READ_LAYOUT / #05-future-work §2 Tier 2）----------------------
# キーごとの絶対座標・サイズ・回転（u 単位、0.25u 刻み。rot は度、キー中心まわり）。
# 記載すると INFO capability LAYOUT が立ち、設定ツールが実機通りの形状で描画する。
# w/h 省略時 1u、rot 省略時 0。座標は各半身の左上が原点。
# 実機形状（2026-06-12 採取）: 全キー 1u のフラット格子。端列と F 行が 0.5u 離れる。
layout_left:
  # r0: Esc＋F1-F6（主ブロックから 0.5u 上に分離）
  - { row: 0, col: 0, x: 0,   y: 0 }   # Esc
  - { row: 0, col: 1, x: 1.5, y: 0 }   # F1
  - { row: 0, col: 2, x: 2.5, y: 0 }   # F2
