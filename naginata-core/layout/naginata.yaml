# =============================================================================
# 薙刀式 v15fix 配列定義（レイヤ + コンボ + 編集モードモデル）
# -----------------------------------------------------------------------------
# build.rs がビルド時に読み phf テーブルへコード生成（実行時パース無し, 要件§8.2-3）。
#
# 基本モデル:
#   - レイヤ出力 = LAYERS[ シフト集合mask ][ ベースキー sc ]
#   - 2キー同時押しは combo2
#   - 3キー同時押しは combo3
#   - 編集操作は modes
#
# sc = 薙刀式 .txt と同じ QWERTYスキャンコードID（q=0x10 … / Set-1系）。
# space=0x39。
# matrix_left/right は実機採取（2026-06-09）に基づく実配線。
#
# 収録:
#   - 単打
#   - センターシフト
#   - 濁音
#   - 半濁音
#   - 小書き
#   - 清音拗音 combo2
#   - 外来音・濁音拗音・半濁音拗音 combo3
#   - IME ON/OFF
#   - 編集モード1/2
#
# 未収録:
#   - 左手側カッコ挿入マクロ
#   - その他未定義の特殊操作
# =============================================================================

window_ms: 40
tap_ms: 40

# --- シフト能力キー（詳細設計 A.2）-----------------------------------------
shifts:
  - { name: CENTER,  sc: 0x39, bit: 0 }   # space: センターシフト
  - { name: R_THUMB, sc: 0x24, bit: 1 }   # j 右親
  - { name: L_THUMB, sc: 0x21, bit: 2 }   # f 左親
  - { name: R_MID,   sc: 0x32, bit: 3 }   # m 右中
  - { name: L_MID,   sc: 0x2f, bit: 4 }   # v 左中
  - { name: A_KEY,   sc: 0x10, bit: 5 }   # q あ位置

layers:
  # ============ 単打面（when:[]）============================================
  - when: []
    kana:
      # qwerty行
      - { sc: 0x10, k: "ヴ" }  # q
      - { sc: 0x11, k: "き" }  # w
      - { sc: 0x12, k: "て" }  # e
      - { sc: 0x13, k: "し" }  # r
      - { sc: 0x17, k: "る" }  # i
      - { sc: 0x18, k: "す" }  # o
      - { sc: 0x19, k: "へ" }  # p
      # asdf行
      - { sc: 0x1e, k: "ろ" }  # a
      - { sc: 0x1f, k: "け" }  # s
      - { sc: 0x20, k: "と" }  # d
      - { sc: 0x21, k: "か" }  # f （左親・単打）
      - { sc: 0x22, k: "っ" }  # g
      - { sc: 0x23, k: "く" }  # h
      - { sc: 0x24, k: "あ" }  # j （右親・単打）
      - { sc: 0x25, k: "い" }  # k
      - { sc: 0x26, k: "う" }  # l
      - { sc: 0x27, k: "ー" }  # ;
      # zxcv行
      - { sc: 0x2c, k: "ほ" }  # z
      - { sc: 0x2d, k: "ひ" }  # x
      - { sc: 0x2e, k: "は" }  # c
      - { sc: 0x2f, k: "こ" }  # v （左中・単打）
      - { sc: 0x30, k: "そ" }  # b
      - { sc: 0x31, k: "た" }  # n
      - { sc: 0x32, k: "な" }  # m （右中・単打）
      - { sc: 0x33, k: "ん" }  # ,
      - { sc: 0x34, k: "ら" }  # .
      - { sc: 0x35, k: "れ" }  # /
    keys:
      - { sc: 0x14, syms: ["Left"] }   # t = ←
      - { sc: 0x15, syms: ["Right"] }  # y = →
      - { sc: 0x16, syms: ["BS"] }     # u = BS
      - { sc: 0x39, syms: ["Space"] }  # space 単打 = スペース

  # ============ センターシフト面（when:[CENTER]）============================
  - when: [CENTER]
    kana:
      - { sc: 0x10, k: "ヴ" }  # q
      - { sc: 0x11, k: "ぬ" }  # w
      - { sc: 0x12, k: "り" }  # e
      - { sc: 0x13, k: "ね" }  # r
      - { sc: 0x16, k: "さ" }  # u
      - { sc: 0x17, k: "よ" }  # i
      - { sc: 0x18, k: "え" }  # o
      - { sc: 0x19, k: "ゆ" }  # p
      - { sc: 0x1e, k: "せ" }  # a
      - { sc: 0x1f, k: "め" }  # s
      - { sc: 0x20, k: "に" }  # d
      - { sc: 0x21, k: "ま" }  # f
      - { sc: 0x22, k: "ち" }  # g
      - { sc: 0x23, k: "や" }  # h
      - { sc: 0x24, k: "の" }  # j
      - { sc: 0x25, k: "も" }  # k
      - { sc: 0x26, k: "つ" }  # l
      - { sc: 0x27, k: "ふ" }  # ;
      - { sc: 0x2c, k: "ほ" }  # z
      - { sc: 0x2d, k: "ひ" }  # x
      - { sc: 0x2e, k: "を" }  # c
      - { sc: 0x30, k: "み" }  # b
      - { sc: 0x31, k: "お" }  # n
      - { sc: 0x33, k: "む" }  # ,
      - { sc: 0x34, k: "わ" }  # .
      - { sc: 0x35, k: "れ" }  # /
    keys:                       # センター特殊セル
      - { sc: 0x2f, syms: ["Comma", "Enter"] }   # v: 、{Enter}（句点で確定）
      - { sc: 0x32, syms: ["Period", "Enter"] }  # m: 。{Enter}
      - { sc: 0x14, syms: ["S-Left"] }           # t: +←（選択）
      - { sc: 0x15, syms: ["S-Right"] }          # y: +→（選択）

  # ============ 濁音（逆手の人差し中段）=====================================
  # 右手の濁音 = 左濁(L_THUMB=f) + 右手かな
  - when: [L_THUMB]
    kana:
      - { sc: 0x16, k: "ざ" }  # さ(u)
      - { sc: 0x18, k: "ず" }  # す(o)
      - { sc: 0x19, k: "べ" }  # へ(p)
      - { sc: 0x23, k: "ぐ" }  # く(h)
      - { sc: 0x26, k: "づ" }  # つ(l)
      - { sc: 0x27, k: "ぶ" }  # ふ(;)
      - { sc: 0x31, k: "だ" }  # た(n)
    keys:
      - { sc: 0x22, syms: ["LANG2"] }  # f+g = IME OFF（英数）
  # 左手の濁音 = 右濁(R_THUMB=j) + 左手かな
  - when: [R_THUMB]
    kana:
      - { sc: 0x11, k: "ぎ" }  # き(w)
      - { sc: 0x12, k: "で" }  # て(e)
      - { sc: 0x13, k: "じ" }  # し(r)
      - { sc: 0x1e, k: "ぜ" }  # せ(a)
      - { sc: 0x1f, k: "げ" }  # け(s)
      - { sc: 0x20, k: "ど" }  # と(d)
      - { sc: 0x21, k: "が" }  # か(f)  ← シフトキーがベース
      - { sc: 0x22, k: "ぢ" }  # ち(g)
      - { sc: 0x2c, k: "ぼ" }  # ほ(z)
      - { sc: 0x2d, k: "び" }  # ひ(x)
      - { sc: 0x2e, k: "ば" }  # は(c)
      - { sc: 0x2f, k: "ご" }  # こ(v)  ← シフトキーがベース
      - { sc: 0x30, k: "ぞ" }  # そ(b)
    keys:
      - { sc: 0x23, syms: ["LANG1"] }  # j+h = IME ON（ひらがな）

  # ============ 半濁音（逆手の下段人差し）===================================
  # 右手の半濁音 = 左半(L_MID=v) + 右手かな
  - when: [L_MID]
    kana:
      - { sc: 0x19, k: "ぺ" }  # へ(p)
      - { sc: 0x27, k: "ぷ" }  # ふ(;)
    keys:
      - { sc: 0x32, syms: ["Enter"] }  # こ(v)+な(m) 同時押し = Enter
  # 左手の半濁音 = 右半(R_MID=m) + 左手かな
  - when: [R_MID]
    kana:
      - { sc: 0x2c, k: "ぽ" }  # ほ(z)
      - { sc: 0x2d, k: "ぴ" }  # ひ(x)
      - { sc: 0x2e, k: "ぱ" }  # は(c)

  # ============ 小書き（小=A_KEY=q と同時押し）==============================
  - when: [A_KEY]
    kana:
      - { sc: 0x17, k: "ょ" }  # よ(i)
      - { sc: 0x18, k: "ぇ" }  # え(o)
      - { sc: 0x19, k: "ゅ" }  # ゆ(p)
      - { sc: 0x23, k: "ゃ" }  # や(h)
      - { sc: 0x24, k: "ぁ" }  # あ(j)  ← シフトキーがベース
      - { sc: 0x25, k: "ぃ" }  # い(k)
      - { sc: 0x26, k: "ぅ" }  # う(l)
      - { sc: 0x31, k: "ぉ" }  # お(n)
      - { sc: 0x34, k: "ゎ" }  # わ(.)

# --- 2キー同時押しコンボ（清音拗音: い段かな + や/ゆ/よ）#10 ----------------
# や=0x23(h), ゆ=0x19(p), よ=0x17(i)。非シフト2キーなので combo2 で解決。
combo2:
  # き(0x11)
  - { keys: [0x11, 0x23], k: "きゃ" }
  - { keys: [0x11, 0x19], k: "きゅ" }
  - { keys: [0x11, 0x17], k: "きょ" }
  # り(0x12)
  - { keys: [0x12, 0x23], k: "りゃ" }
  - { keys: [0x12, 0x19], k: "りゅ" }
  - { keys: [0x12, 0x17], k: "りょ" }
  # し(0x13)
  - { keys: [0x13, 0x23], k: "しゃ" }
  - { keys: [0x13, 0x19], k: "しゅ" }
  - { keys: [0x13, 0x17], k: "しょ" }
  # に(0x20)
  - { keys: [0x20, 0x23], k: "にゃ" }
  - { keys: [0x20, 0x19], k: "にゅ" }
  - { keys: [0x20, 0x17], k: "にょ" }
  # ち(0x22)
  - { keys: [0x22, 0x23], k: "ちゃ" }
  - { keys: [0x22, 0x19], k: "ちゅ" }
  - { keys: [0x22, 0x17], k: "ちょ" }
  # ひ(0x2d)
  - { keys: [0x2d, 0x23], k: "ひゃ" }
  - { keys: [0x2d, 0x19], k: "ひゅ" }
  - { keys: [0x2d, 0x17], k: "ひょ" }
  # み(0x30)
  - { keys: [0x30, 0x23], k: "みゃ" }
  - { keys: [0x30, 0x19], k: "みゅ" }
  - { keys: [0x30, 0x17], k: "みょ" }

# --- 3キー同時押しコンボ（外来音・濁音拗音・半濁音拗音）#10 Stage B --------------
# 大岡式: 2キー前置（で・じ・きゃ等）は確定を遅延し、窓内に3キー目が来れば3キー優先。
# トリガ: 右半=0x32(m) 左半=0x2f(v) 右濁=0x24(j) 左濁=0x21(f) 小/ヴ=0x10(q)
# 母音/小: あ24 い25 う26 え18 お31 や23 ゆ19 よ17 わ34
combo3:
  # --- 外来音 ---
  # テ: ティ/テュ/ディ/デュ
  - { keys: [0x32, 0x12, 0x25], k: "てぃ" }
  - { keys: [0x32, 0x12, 0x19], k: "てゅ" }
  - { keys: [0x24, 0x12, 0x25], k: "でぃ" }
  - { keys: [0x24, 0x12, 0x19], k: "でゅ" }
  # ト: トゥ/ドゥ
  - { keys: [0x32, 0x20, 0x26], k: "とぅ" }
  - { keys: [0x24, 0x20, 0x26], k: "どぅ" }
  # シェ/チェ系
  - { keys: [0x32, 0x13, 0x18], k: "しぇ" }
  - { keys: [0x32, 0x22, 0x18], k: "ちぇ" }
  - { keys: [0x24, 0x13, 0x18], k: "じぇ" }
  - { keys: [0x24, 0x22, 0x18], k: "ぢぇ" }
  # フ系（左半+ふ0x27+母音）
  - { keys: [0x2f, 0x27, 0x24], k: "ふぁ" }
  - { keys: [0x2f, 0x27, 0x25], k: "ふぃ" }
  - { keys: [0x2f, 0x27, 0x18], k: "ふぇ" }
  - { keys: [0x2f, 0x27, 0x31], k: "ふぉ" }
  - { keys: [0x2f, 0x27, 0x19], k: "ふゅ" }
  # ヴ系（右半+ヴ0x10+母音）
  - { keys: [0x32, 0x10, 0x24], k: "ヴぁ" }
  - { keys: [0x32, 0x10, 0x25], k: "ヴぃ" }
  - { keys: [0x32, 0x10, 0x18], k: "ヴぇ" }
  - { keys: [0x32, 0x10, 0x31], k: "ヴぉ" }
  - { keys: [0x32, 0x10, 0x19], k: "ヴゅ" }
  # ウ系（左半+う0x26+母音） / イェ / ツァ
  - { keys: [0x2f, 0x26, 0x25], k: "うぃ" }
  - { keys: [0x2f, 0x26, 0x18], k: "うぇ" }
  - { keys: [0x2f, 0x26, 0x31], k: "うぉ" }
  - { keys: [0x2f, 0x25, 0x18], k: "いぇ" }
  - { keys: [0x2f, 0x26, 0x24], k: "つぁ" }  # ウァと被るがツァを採用
  # ク系（左半+く0x23+母音/わ）
  - { keys: [0x2f, 0x23, 0x24], k: "くぁ" }
  - { keys: [0x2f, 0x23, 0x25], k: "くぃ" }
  - { keys: [0x2f, 0x23, 0x18], k: "くぇ" }
  - { keys: [0x2f, 0x23, 0x31], k: "くぉ" }
  - { keys: [0x2f, 0x23, 0x34], k: "くゎ" }
  # グ系（左濁+く0x23+母音/わ）
  - { keys: [0x21, 0x23, 0x24], k: "ぐぁ" }
  - { keys: [0x21, 0x23, 0x25], k: "ぐぃ" }
  - { keys: [0x21, 0x23, 0x18], k: "ぐぇ" }
  - { keys: [0x21, 0x23, 0x31], k: "ぐぉ" }
  - { keys: [0x21, 0x23, 0x34], k: "ぐゎ" }
  # --- 濁音拗音（右濁+い段+や/ゆ/よ）---
  - { keys: [0x24, 0x11, 0x23], k: "ぎゃ" }
  - { keys: [0x24, 0x11, 0x19], k: "ぎゅ" }
  - { keys: [0x24, 0x11, 0x17], k: "ぎょ" }
  - { keys: [0x24, 0x13, 0x23], k: "じゃ" }
  - { keys: [0x24, 0x13, 0x19], k: "じゅ" }
  - { keys: [0x24, 0x13, 0x17], k: "じょ" }
  - { keys: [0x24, 0x22, 0x23], k: "ぢゃ" }
  - { keys: [0x24, 0x22, 0x19], k: "ぢゅ" }
  - { keys: [0x24, 0x22, 0x17], k: "ぢょ" }
  - { keys: [0x24, 0x2d, 0x23], k: "びゃ" }
  - { keys: [0x24, 0x2d, 0x19], k: "びゅ" }
  - { keys: [0x24, 0x2d, 0x17], k: "びょ" }
  # --- 半濁音拗音（右半+ひ0x2d+や/ゆ/よ）---
  - { keys: [0x32, 0x2d, 0x23], k: "ぴゃ" }
  - { keys: [0x32, 0x2d, 0x19], k: "ぴゅ" }
  - { keys: [0x32, 0x2d, 0x17], k: "ぴょ" }

# --- 編集モード（2キートリガで持続モード→右手で編集操作）#10 -----------------
# 左手のカッコ挿入マクロは未収録（右手2モードのみ）。
modes:
  # 編集モード1: D(0x20)+F(0x21) 押しながら → カーソル/削除
  - id: 1
    trigger: [0x20, 0x21]
    map:
      - { sc: 0x15, syms: ["Home"] }              # y
      - { sc: 0x16, syms: ["S-End", "BS"] }       # u: 行末まで選択して削除
      - { sc: 0x18, syms: ["Del"] }               # o
      - { sc: 0x19, syms: ["Esc", "Esc", "Esc"] } # p
      - { sc: 0x23, syms: ["Enter", "End"] }      # h
      - { sc: 0x24, syms: ["Up"] }                # j
      - { sc: 0x25, syms: ["S-Up"] }              # k
      - { sc: 0x26, syms: ["S-Up*7"] }            # l
      - { sc: 0x27, syms: ["C-i"] }               # ;
      - { sc: 0x31, syms: ["End"] }               # n
      - { sc: 0x32, syms: ["Down"] }              # m
      - { sc: 0x33, syms: ["S-Down"] }            # ,
      - { sc: 0x34, syms: ["S-Down*7"] }          # .
      - { sc: 0x35, syms: ["C-u"] }               # /
  # 編集モード2: C(0x2e)+V(0x2f) 押しながら → コピペ/選択
  - id: 2
    trigger: [0x2e, 0x2f]
    map:
      - { sc: 0x15, syms: ["S-Home"] }   # y
      - { sc: 0x16, syms: ["C-x"] }      # u: 切り取り
      - { sc: 0x17, syms: ["C-v"] }      # i: 貼り付け
      - { sc: 0x18, syms: ["C-y"] }      # o: redo
      - { sc: 0x19, syms: ["C-z"] }      # p: undo
      - { sc: 0x23, syms: ["C-c"] }      # h: コピー
      - { sc: 0x24, syms: ["Right"] }    # j
      - { sc: 0x25, syms: ["S-Right"] }  # k
      - { sc: 0x26, syms: ["S-Right*5"] }# l
      - { sc: 0x27, syms: ["S-Right*20"] }# ;
      - { sc: 0x31, syms: ["S-End"] }    # n
      - { sc: 0x32, syms: ["Left"] }     # m
      - { sc: 0x33, syms: ["S-Left"] }   # ,
      - { sc: 0x34, syms: ["S-Left*5"] } # .
      - { sc: 0x35, syms: ["S-Left*20"] }# /

# --- マトリクス位置 → sc（実機採取 2026-06-09）。位置キー=row*16+col（§2.1）---
# 左手: c1=外(小指)…c5=内(人差). 右手も同様(対称配線)。r0(ESC/F*)はかな非使用。
matrix_left:
  # r1: Q W E R T
  - { row: 1, col: 1, sc: 0x10 }
  - { row: 1, col: 2, sc: 0x11 }
  - { row: 1, col: 3, sc: 0x12 }
  - { row: 1, col: 4, sc: 0x13 }
  - { row: 1, col: 5, sc: 0x14 }
  # r2: A S D F G
  - { row: 2, col: 1, sc: 0x1e }
  - { row: 2, col: 2, sc: 0x1f }
  - { row: 2, col: 3, sc: 0x20 }
  - { row: 2, col: 4, sc: 0x21 }
  - { row: 2, col: 5, sc: 0x22 }
  # r3: Z X C V B
  - { row: 3, col: 1, sc: 0x2c }
  - { row: 3, col: 2, sc: 0x2d }
  - { row: 3, col: 3, sc: 0x2e }
  - { row: 3, col: 4, sc: 0x2f }
  - { row: 3, col: 5, sc: 0x30 }
  # r4: SPACE（センターシフト）
  - { row: 4, col: 5, sc: 0x39 }

matrix_right:
  # r1: P O I U Y （c1=外→c5=内）
  - { row: 1, col: 1, sc: 0x19 }
  - { row: 1, col: 2, sc: 0x18 }
  - { row: 1, col: 3, sc: 0x17 }
  - { row: 1, col: 4, sc: 0x16 }
  - { row: 1, col: 5, sc: 0x15 }
  # r2: ; L K J H
  - { row: 2, col: 1, sc: 0x27 }
  - { row: 2, col: 2, sc: 0x26 }
  - { row: 2, col: 3, sc: 0x25 }
  - { row: 2, col: 4, sc: 0x24 }
  - { row: 2, col: 5, sc: 0x23 }
  # r3: / . , M N
  - { row: 3, col: 1, sc: 0x35 }
  - { row: 3, col: 2, sc: 0x34 }
  - { row: 3, col: 3, sc: 0x33 }
  - { row: 3, col: 4, sc: 0x32 }
  - { row: 3, col: 5, sc: 0x31 }
  # r4: SPACE（センターシフト）
  - { row: 4, col: 5, sc: 0x39 }

# --- 全物理スイッチ位置（READ_MATRIX_FULL / #05-future-work §2 Tier 1）-------
# matrix_left/right に載らない（薙刀式 sc 未割当の）物理スイッチの列挙。
# 設定ツールのキーボード描画に破線キーとして現れ、クリックで EXTRA（直接キー）を
# 割り当てられる。row/col は実機採取（2026-06-12, READ_LASTKEY のキー学習）。
# コメントの刻印名は元キーキャップの表記（出力の割当自体はツールの EXTRA で行う）。
physical_left:
  # r0: ESC＋ファンクション行
  - { row: 0, col: 0 }   # Esc
  - { row: 0, col: 1 }   # F1
